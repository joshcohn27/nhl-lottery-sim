name: Update standings

on:
  schedule:
    # Every 4 hours, offset a few minutes past the hour - GitHub documents
    # that on-the-hour schedules are the likeliest to be delayed or dropped
    # under load.
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run standings updater
        run: node scripts/update-standings.mjs

      - name: Commit standings.json if it changed
        run: |
          if git diff --quiet -- public/data/standings.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/standings.json
          git commit -m "chore: update standings ($(date -u +%Y-%m-%d))"
          git push
