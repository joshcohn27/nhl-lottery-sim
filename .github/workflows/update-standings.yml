name: Update standings

on:
  schedule:
    # GitHub Actions cron is UTC-only. Midnight America/New_York is 04:00 UTC
    # during EDT and 05:00 UTC during EST - the script itself checks the actual
    # NY hour and no-ops on whichever of these two runs isn't really midnight.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it isn't midnight America/New_York right now"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run standings updater
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/update-standings.mjs

      - name: Commit standings.json if it changed
        run: |
          if git diff --quiet -- public/data/standings.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/standings.json
          git commit -m "chore: update standings ($(date -u +%Y-%m-%d))"
          git push
